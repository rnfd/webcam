# MediaMTX (local dev): one WebRTC stream per camera — cam1/cam2 are the main
# streams the page plays (full camera quality, video copied), cam1sub/cam2sub the
# small ones behind the page's SD button — plus the stacked composite that the
# recorder and Telegram snapshots use.
# Each camera publisher loops: while ./state/disabled exists (Telegram /disable)
# it publishes nothing at all — no RTSP session to the camera and no encoder
# standing in for it, so an idle path costs one sleeping shell; otherwise it
# streams the camera.
logLevel: info
readTimeout: 15s
writeTimeout: 15s

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcAdditionalHosts: [192.168.1.250]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189

hls: no
rtmp: no
srt: no

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: publish
      - action: read
      - action: playback

paths:
  # One publisher per stream, all four running cam-publish.sh — the same script
  # the NixOS module uses, so /disable behaves identically here. HD (main) is
  # what the page plays; SD (sub) is its low-bandwidth toggle and the
  # compositor's input. Run MediaMTX from the repo root, and export FF/FONT to
  # get a specific ffmpeg and captioned placeholders.
  cam1:
    record: yes
    recordDeleteAfter: 5m       # /timelapse cuts its clips out of this buffer
    runOnInit: ./cam-publish.sh 192.168.1.146 cam1 main
    runOnInitRestart: yes
  cam2:
    record: yes
    recordDeleteAfter: 5m
    runOnInit: ./cam-publish.sh 192.168.1.185 cam2 main
    runOnInitRestart: yes
  cam1sub:
    runOnInit: ./cam-publish.sh 192.168.1.146 cam1sub sub
    runOnInitRestart: yes
  cam2sub:
    runOnInit: ./cam-publish.sh 192.168.1.185 cam2sub sub
    runOnInitRestart: yes
  # Stacked composite — the same cam-composite.sh the NixOS module runs, so the
  # encode and the /disable behaviour are identical here. Nothing on the web
  # plays it: it is what gets recorded to disk and Google Drive, so a session is
  # one combined video.
  composite:
    runOnInit: ./cam-composite.sh
    runOnInitRestart: yes
